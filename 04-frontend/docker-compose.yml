# Sobe a aplicação completa: docker compose up --build  →  http://localhost:8501
services:
  api:
    build: ./backend
    env_file: .env
    environment:
      CORS_ORIGINS: http://localhost:8501
    volumes:
      - ../dados/ocorrencias.csv:/data/ocorrencias.csv:ro
      - runtime:/data/runtime
    ports: ["8000:8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      retries: 5
  web:
    build: ./frontend
    environment:
      API_URL: http://api:8000
    ports: ["8501:8501"]
    depends_on:
      api:
        condition: service_healthy
volumes:
  runtime:
